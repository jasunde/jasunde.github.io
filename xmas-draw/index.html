<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='28' r='24' fill='%2322385a' stroke='%23aebdd4' stroke-width='3'/%3E%3Cpath d='M10 36 Q32 26 54 36 L54 44 Q32 54 10 44Z' fill='%23f3f6fb'/%3E%3Crect x='14' y='50' width='36' height='10' rx='2' fill='%235b3a27'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="preview-icon.png">
<style>html, body { margin: 0; }</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* A single, deliberate winter-night look: the same in light and dark hosts. */
  :root {
    color-scheme: dark;
    --night: #0e1a2d;
    --night-2: #182a45;
    --snow: #f3f6fb;
    --frost: #aebdd4;
    --lamp: #f2c46d;
    --walnut: #5b3a27;
    --walnut-dark: #3c2518;
    --brass: #caa35a;
    --brass-dark: #8f6f33;
    --display: "Caprasimo", "Georgia", serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 80% 55% at 50% 0%, #22385a 0%, transparent 70%),
      var(--night);
    color: var(--snow);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
  }
  .page {
    min-height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }
  .demo-chip {
    border: 1px solid rgba(242, 196, 109, .5);
    color: var(--lamp);
    border-radius: 999px;
    padding: 1px 8px;
    margin-left: 6px;
    letter-spacing: 0.1em;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--frost);
  }
  h1 {
    margin: 6px 0 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1.1;
    text-wrap: balance;
  }
  .lede { margin: 8px auto 0; color: var(--frost); max-width: 34ch; }

  /* The globe and its wooden base */
  .globe-wrap {
    width: min(360px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 50% 90%;
  }
  .globe-wrap.shaking { animation: shake 1.1s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0); }
    10%  { transform: translate(-14px, -4px) rotate(-7deg); }
    22%  { transform: translate(14px, -8px) rotate(7deg); }
    34%  { transform: translate(-12px, -3px) rotate(-6deg); }
    46%  { transform: translate(11px, -6px) rotate(5deg); }
    58%  { transform: translate(-8px, -2px) rotate(-4deg); }
    70%  { transform: translate(6px, -3px) rotate(3deg); }
    82%  { transform: translate(-3px, 0) rotate(-1.5deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    cursor: pointer;
    border-radius: 50%;
    position: relative;
    z-index: 1;
    touch-action: manipulation;
  }
  canvas:focus-visible { outline: 3px solid var(--lamp); outline-offset: 6px; }
  .base {
    position: relative;
    width: 78%;
    margin-top: -8%;
    height: 74px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 30%),
      linear-gradient(90deg, var(--walnut-dark), var(--walnut) 30%, #6d4630 55%, var(--walnut) 75%, var(--walnut-dark));
    clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
    box-sizing: border-box;
    box-shadow: 0 18px 30px rgba(0,0,0,.35);
  }
  .plate {
    background: linear-gradient(180deg, #e6c47f, var(--brass) 45%, var(--brass-dark));
    color: #3a2a10;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.4);
  }
  .shadow {
    width: 70%;
    height: 14px;
    margin-top: 2px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.45), transparent);
  }

  .reveal { min-height: 3.2em; margin: 0; font-size: 18px; max-width: 32ch; }
  .reveal strong { font-family: var(--display); font-weight: 400; color: var(--lamp); font-size: 22px; }

  button {
    font: 600 16px/1 var(--body);
    color: #2a1d06;
    background: var(--lamp);
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(242, 196, 109, .25);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(242, 196, 109, .35); }
  button:focus-visible { outline: 3px solid var(--snow); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; transform: none; }

  .kids {
    max-width: 38ch;
    margin: 0;
    padding: 14px 18px;
    border: 1px solid rgba(242, 196, 109, .35);
    border-radius: 14px;
    background: rgba(24, 42, 69, .7);
    font-size: 15px;
  }
  .kids strong { color: var(--lamp); font-weight: 600; }

  .note {
    max-width: 44ch;
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--frost);
    border-top: 1px solid rgba(174, 189, 212, .2);
    padding-top: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .globe-wrap.shaking { animation: none; }
    button { transition: none; }
  }
</style>

</head>
<body>
<main class="page">
  <header>
    <div class="eyebrow" id="eyebrow">Christmas Gift Exchange</div>
    <h1 id="greeting">Merry Christmas!</h1>
    <p class="lede" id="lede">Your name for this year is hidden in the snow. Give the globe a shake.</p>
  </header>

  <div class="globe-wrap" id="globeWrap">
    <canvas id="globe" tabindex="0" role="img" aria-label="Snow globe. Shake it to reveal who you are giving to."></canvas>
    <div class="base"><span class="plate">Christmas 2026</span></div>
    <div class="shadow"></div>
  </div>

  <p class="reveal" id="reveal" aria-live="polite"></p>
  <button id="shakeBtn" type="button">Shake the snow globe</button>

  <p class="kids">And don't forget: everyone can give to the kids, <strong>Jacob</strong>, <strong>Dorothea</strong>, and <strong>Aoife</strong>.</p>

  <p class="note" id="note">This link is just for you. It only opens your own name, so please don't forward it.</p>
</main>

<script>
(() => {
  // Each entry is one person's draw, sealed with the private code in their own link.
  // Without that code an entry can't be read, so the page never shows anyone else's name.
  const SEALED = [{"id":"00a71b7dd137320e","data":"7D6UvcLLWsy0L5aJEJYIYTcgll0Y3G/F5C0TUS/wS/Fx8g=="},{"id":"3ad77c30d166faa5","data":"8LkQIf3cZ2RZAUGowoAfvsvus3QZx+W5Ruo1q3zhiNrKkUwABw=="},{"id":"4f3599e57b03066b","data":"98GxSUasUOHYqw+bk/RQ3c54ojduxd62noiXJNz8vJIy5TBEvdu5"},{"id":"6052e7fdbfb9432b","data":"eIOJqTnpCL2a1xBHTnfvlqNdWCWxqckxwc790xbgto2f0ckO34O/"},{"id":"717dd72c4d77d6c8","data":"w6XilHY2gM4Lh4lBxUrK2WZa83GQO34BOpfC7AWzjwzFn2yt"},{"id":"71f2711b91602e3a","data":"OskkJIuK3Gc2h2nvdJt5upiO9eWCBRXcTp9KCtwLInh/Cw=="},{"id":"7a16f431410f665c","data":"EV4u0o0pghZkRkv7az6XLZc6ajWbImItHgYlX9Ybr9Q/7ClP"},{"id":"ecfa0fa571d1460e","data":"eUQ+3Sv44eEx4d3Xx4wYA6RmvOP6U5fNEwUF+my8jXTvhD1cNA9FYmo="}];

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("globe");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("globeWrap");
  const button = document.getElementById("shakeBtn");
  const reveal = document.getElementById("reveal");

  let size = 0, dpr = 1, R = 0, cx = 0, cy = 0;
  let flakes = [];
  let recipient = "";
  let myRecipient = "";
  let revealStart = null;   // time snow began settling after a shake
  let shakeUntil = 0;
  let busy = false;
  let trees = [];

  /* ---------- Opening this person's sealed name ---------- */

  async function sha256(text) {
    return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)));
  }

  async function openSealed(code) {
    const idBytes = await sha256("id|" + code);
    const id = Array.from(idBytes, b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
    const entry = SEALED.find(e => e.id === id);
    if (!entry) return null;
    const data = Uint8Array.from(atob(entry.data), c => c.charCodeAt(0));
    const plain = new Uint8Array(data.length);
    for (let block = 0; block * 32 < data.length; block++) {
      const key = await sha256(code + "|" + block);
      for (let i = 0; i < 32 && block * 32 + i < data.length; i++) plain[block * 32 + i] = data[block * 32 + i] ^ key[i];
    }
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function showMissingCode() {
    document.getElementById("greeting").textContent = "This link is missing its code";
    document.getElementById("lede").textContent = "Open the exact link you were sent. It ends with a # and a short code that unlocks your name.";
    document.getElementById("note").textContent = "If you can't find your link, ask whoever sent it to send it again.";
    button.disabled = true;
    button.textContent = "No name to reveal";
  }

  /* ---------- The globe ---------- */

  function groundY(x) {
    // A gentle snowy hill across the bottom of the globe.
    const t = (x - cx) / R;
    return cy + R * (0.52 - 0.1 * Math.cos(t * Math.PI * 0.9));
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = canvas.clientWidth;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = size / 2 - 3;
    cx = size / 2;
    cy = size / 2;
    trees = [
      { x: cx - R * 0.55, h: R * 0.30 },
      { x: cx - R * 0.38, h: R * 0.22 },
      { x: cx + R * 0.46, h: R * 0.34 },
      { x: cx + R * 0.62, h: R * 0.20 },
    ];
    if (!flakes.length) seedFlakes();
  }

  function randomPointInGlobe() {
    for (;;) {
      const x = cx + (Math.random() * 2 - 1) * R;
      const y = cy + (Math.random() * 2 - 1) * R;
      if (Math.hypot(x - cx, y - cy) < R * 0.95 && y < groundY(x)) return { x, y };
    }
  }

  function seedFlakes() {
    const count = reduceMotion ? 90 : 240;
    flakes = Array.from({ length: count }, () => {
      const p = randomPointInGlobe();
      return {
        x: p.x, y: p.y, vx: 0, vy: 0,
        r: 0.8 + Math.random() * 2.2,
        drift: Math.random() * Math.PI * 2,
        landed: false,
      };
    });
  }

  function stir() {
    for (const f of flakes) {
      f.landed = false;
      const a = Math.random() * Math.PI * 2;
      const s = (2 + Math.random() * 6) * (R / 160);
      f.vx = Math.cos(a) * s;
      f.vy = Math.sin(a) * s - 3 * (R / 160);
    }
  }

  function step(now) {
    const shaking = now < shakeUntil;
    const k = R / 160;
    for (const f of flakes) {
      if (f.landed) continue;
      if (shaking) {
        // Swirl: keep kicking flakes around while the globe moves.
        f.vx += (Math.random() - 0.5) * 1.4 * k;
        f.vy += (Math.random() - 0.5) * 1.4 * k - 0.05 * k;
      } else {
        f.drift += 0.02;
        f.vx += Math.sin(f.drift) * 0.004 * k;
        f.vy += 0.012 * k * (0.6 + f.r * 0.25);   // bigger flakes fall a little faster
      }
      f.vx *= 0.97;
      f.vy *= 0.97;
      f.x += f.vx;
      f.y += f.vy;

      // Keep flakes inside the glass.
      const dx = f.x - cx, dy = f.y - cy;
      const d = Math.hypot(dx, dy);
      const limit = R - f.r - 2;
      if (d > limit) {
        const nx = dx / d, ny = dy / d;
        f.x = cx + nx * limit;
        f.y = cy + ny * limit;
        const dot = f.vx * nx + f.vy * ny;
        f.vx -= 1.6 * dot * nx;
        f.vy -= 1.6 * dot * ny;
      }

      const g = groundY(f.x);
      if (f.y > g - f.r) {
        if (shaking) { f.y = g - f.r; f.vy = -Math.abs(f.vy); }
        else { f.y = g - f.r * 0.5; f.landed = true; }
      }
    }

    // When idle and most snow has settled, let a few flakes keep falling.
    if (!shaking && revealStart !== null && now - revealStart > 5000) {
      for (let i = 0; i < 2; i++) {
        const f = flakes[(Math.random() * flakes.length) | 0];
        if (f.landed) {
          const p = randomPointInGlobe();
          f.x = p.x; f.y = cy - R * 0.85 + Math.random() * R * 0.2;
          f.vx = 0; f.vy = 0; f.landed = false;
        }
      }
    }
  }

  function drawTree(x, h) {
    const base = groundY(x);
    ctx.fillStyle = "#1d4a3c";
    for (let i = 0; i < 3; i++) {
      const w = h * (0.55 - i * 0.12);
      const top = base - h * (0.45 + i * 0.28);
      const bottom = base - h * (i * 0.25);
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x - w / 2, bottom);
      ctx.lineTo(x + w / 2, bottom);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "rgba(243,246,251,.85)";
    ctx.beginPath();
    ctx.arc(x, base - h * 1.01, h * 0.035, 0, Math.PI * 2);
    ctx.fill();
  }

  function fitFont(text, maxWidth, start) {
    let px = start;
    ctx.font = `${px}px Caprasimo, Georgia, serif`;
    while (ctx.measureText(text).width > maxWidth && px > 14) {
      px -= 2;
      ctx.font = `${px}px Caprasimo, Georgia, serif`;
    }
    return px;
  }

  function draw(now) {
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();

    // Night sky inside the glass
    const sky = ctx.createRadialGradient(cx, cy - R * 0.3, R * 0.1, cx, cy, R);
    sky.addColorStop(0, "#2d4a73");
    sky.addColorStop(1, "#101d33");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, size, size);

    // Name, behind the falling snow
    let alpha = 0;
    if (revealStart !== null) {
      alpha = reduceMotion ? 1 : Math.min(1, Math.max(0, (now - revealStart - 400) / 2200));
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (recipient) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const px = fitFont(recipient, R * 1.45, Math.round(R * 0.34));
      ctx.shadowColor = "rgba(242,196,109,.55)";
      ctx.shadowBlur = px * 0.5;
      ctx.fillStyle = "#f7d893";
      ctx.fillText(recipient, cx, cy - R * 0.12);
      ctx.restore();
    }
    if (alpha < 1) {
      ctx.save();
      ctx.globalAlpha = 0.28 * (1 - alpha);
      ctx.font = `${Math.round(R * 0.5)}px Caprasimo, Georgia, serif`;
      ctx.fillStyle = "#dfe7f3";
      ctx.fillText("?", cx, cy - R * 0.12);
      ctx.restore();
    }

    // Snowy hill and trees
    for (const t of trees) drawTree(t.x, t.h);
    ctx.fillStyle = "#e9eef6";
    ctx.beginPath();
    ctx.moveTo(cx - R, cy + R);
    for (let x = cx - R; x <= cx + R; x += 4) ctx.lineTo(x, groundY(x));
    ctx.lineTo(cx + R, cy + R);
    ctx.closePath();
    ctx.fill();

    // Snow
    ctx.fillStyle = "#ffffff";
    for (const f of flakes) {
      ctx.globalAlpha = f.landed ? 0.9 : 0.75 + f.r * 0.08;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Glass: rim and highlights
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(220,232,250,.35)";
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    const shine = ctx.createLinearGradient(cx - R, cy - R, cx, cy);
    shine.addColorStop(0, "rgba(255,255,255,.28)");
    shine.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = shine;
    ctx.lineWidth = R * 0.07;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.86, Math.PI * 1.08, Math.PI * 1.42);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.beginPath();
    ctx.ellipse(cx + R * 0.45, cy - R * 0.55, R * 0.07, R * 0.035, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function frame(now) {
    step(now);
    draw(now);
    requestAnimationFrame(frame);
  }

  function shake() {
    if (busy || !myRecipient) return;
    busy = true;
    button.disabled = true;
    reveal.textContent = "";

    const now = performance.now();
    const duration = reduceMotion ? 0 : 1100;
    revealStart = null;
    recipient = myRecipient;
    stir();
    shakeUntil = now + duration;

    wrap.classList.remove("shaking");
    void wrap.offsetWidth;   // restart the CSS animation
    wrap.classList.add("shaking");

    setTimeout(() => {
      revealStart = performance.now();
      setTimeout(() => {
        reveal.innerHTML = "";
        reveal.append("This Christmas you're giving a gift to ");
        const name = document.createElement("strong");
        name.textContent = recipient;
        reveal.append(name, ".");
        button.textContent = "Shake it again";
        button.disabled = false;
        busy = false;
        canvas.setAttribute("aria-label", `Snow globe showing ${recipient}.`);
      }, reduceMotion ? 0 : 2600);
    }, duration);
  }

  canvas.addEventListener("click", shake);
  canvas.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); shake(); }
  });
  button.addEventListener("click", shake);
  wrap.addEventListener("animationend", () => wrap.classList.remove("shaking"));
  window.addEventListener("resize", () => {
    const old = size;
    resize();
    if (old && Math.abs(old - size) > 1) seedFlakes();
  });

  // The #demo link shows the real page with a made-up name, for previewing it safely.
  function showDemo() {
    const chip = document.createElement("span");
    chip.className = "demo-chip";
    chip.textContent = "Demo";
    document.getElementById("eyebrow").append(chip);
    document.getElementById("note").textContent = "This is a demo with a made-up name. Each person's own link shows their real one.";
    myRecipient = "Rudolph";
  }

  async function start() {
    const code = location.hash.slice(1);
    if (code === "demo") { showDemo(); return; }
    let mine = null;
    try { if (code) mine = await openSealed(code); } catch (e) { mine = null; }
    if (!mine) { showMissingCode(); return; }
    myRecipient = mine.recipient;
    document.getElementById("greeting").textContent = `Merry Christmas, ${mine.giver}!`;
  }

  button.disabled = true;
  start().then(() => { if (myRecipient) button.disabled = false; });
  window.addEventListener("hashchange", () => location.reload());

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
